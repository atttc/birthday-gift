<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快乐！</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, rgba(253, 245, 252, 0.8), rgba(227, 225, 246, 0.8)), url('balloon.png');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #5a4a6d;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            position: relative;
        }
        
        h1 {
            color: #ffa0de;
            margin-bottom: 20px;
            font-size: 2.8rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .birthday-message {
            font-size: 1.3rem;
            margin-bottom: 30px;
            line-height: 1.6;
            color: #6d5875;
        }
        
        .cake-container {
            position: relative;
            margin: 40px auto;
            width: 300px;
            height: 300px;
        }
        
        .cake {
            position: relative;
            width: 220px;
            height: 180px;
            margin: 0 auto;
        }
        
        .cake-base {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 100px;
            background: linear-gradient(to bottom, #f4bfe3, #e8a8d5);
            border-radius: 100px 100px 20px 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .cake-middle {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 60px;
            background: linear-gradient(to bottom, #e8f2b1, #bed7a1);
            border-radius: 90px 90px 10px 10px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.08);
        }
        
        .cake-top {
            position: absolute;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 50px;
            background: linear-gradient(to bottom, #fdf5fc, #e3e1f6);
            border-radius: 80px 80px 5px 5px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.08);
        }
        
        .candle {
            position: absolute;
            bottom: 175px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 40px;
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            border-radius: 5px;
            z-index: 10;
        }
        
        .flame {
            position: absolute;
            bottom: 215px;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 25px;
            background: linear-gradient(to bottom, #ffef78, #ff9d00);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px 5px rgba(255, 157, 0, 0.6);
            animation: flicker 1.5s infinite alternate;
        }
        
        @keyframes flicker {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.1); }
        }
        
        .plate-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }
        
        .plate-container.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .plate {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle at center, #f8f8f8, #e0e0e0);
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin-top: 20px;
        }
        
        .plate-rim {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 50%;
            border: 2px solid #e0e0e0;
            box-shadow: 0 0 0 1px #f0f0f0;
        }
        
        .cake-slice {
            width: 80px;
            height: 100px;
            background: linear-gradient(to bottom, #f4bfe3, #e8a8d5);
            border-radius: 0 25px 25px 0;
            margin: 5px;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.4s ease;
            position: relative;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
        }
        
        .cake-slice.show {
            opacity: 1;
            transform: scale(1);
        }
        
        .cake-slice.eaten {
            opacity: 0.3;
            transform: scale(0.7);
        }
        
        .cake-slice-frosting {
            position: absolute;
            top: 0;
            right: 0;
            width: 20px;
            height: 100%;
            background: linear-gradient(to bottom, #e8f2b1, #bed7a1);
            border-radius: 0 25px 25px 0;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
        }
        
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .blow-btn {
            background: linear-gradient(to right, #bed7a1, #a8c97f);
            color: white;
        }
        
        .cut-btn {
            background: linear-gradient(to right, #e3e1f6, #c9c5e8);
            color: #5a4a6d;
        }
        
        .eat-btn {
            background: linear-gradient(to right, #f4bfe3, #e8a8d5);
            color: white;
        }
        
        .continue-btn {
            background: linear-gradient(to right, #ff9abb, #ff7da9);
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            margin-top: 20px;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        .status {
            margin-top: 20px;
            font-size: 1.2rem;
            min-height: 30px;
            color: #8a4a6d;
            font-weight: bold;
            padding: 10px;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        
        .decoration {
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            z-index: 5;
        }
        
        .decoration-1 {
            background-color: #e8f2b1;
            top: 40px;
            left: 60px;
        }
        
        .decoration-2 {
            background-color: #bed7a1;
            top: 60px;
            left: 100px;
        }
        
        .decoration-3 {
            background-color: #f4bfe3;
            top: 30px;
            left: 140px;
        }
        
        .decoration-4 {
            background-color: #e3e1f6;
            top: 70px;
            left: 80px;
        }
        
        .decoration-5 {
            background-color: #e8f2b1;
            top: 50px;
            left: 120px;
        }
        
        .plate-label {
            font-size: 1.2rem;
            color: #8a6d9e;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .cake-label {
            font-size: 1.2rem;
            color: #8a6d9e;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .animation-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .birthday-message-popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
        }
        
        .birthday-message-popup.show {
            opacity: 1;
            visibility: visible;
        }
        
        .birthday-message-content {
            background: linear-gradient(135deg, #fdf5fc, #e3e1f6);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transform: scale(0.7);
            transition: transform 0.5s ease;
            max-width: 500px;
            width: 90%;
        }
        
        .birthday-message-popup.show .birthday-message-content {
            transform: scale(1);
        }
        
        .birthday-message-content h2 {
            color: #faa0c1cc;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        
        .birthday-message-content p {
            font-size: 1.3rem;
            color: #ecaebe;
            line-height: 1.6;
        }
        
        .close-popup {
            margin-top: 20px;
            padding: 10px 25px;
            background: linear-gradient(to right, #ffb8cb, #ff97b3);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .close-popup:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>生日快乐！</h1>
        
        <div class="birthday-message">
            吹灭蜡烛~~<br>
            ^^往下拉一点,妈妈<br>
            再点切蛋糕和吃蛋糕<br>
            蛋糕要吃完<br>
            
        </div>
        
        <div class="animation-area">
            <div class="cake-label"></div>
            <div class="cake-container">
                <div class="cake">
                    <div class="cake-base"></div>
                    <div class="cake-middle"></div>
                    <div class="cake-top"></div>
                    
                    <div class="decoration decoration-1"></div>
                    <div class="decoration decoration-2"></div>
                    <div class="decoration decoration-3"></div>
                    <div class="decoration decoration-4"></div>
                    <div class="decoration decoration-5"></div>
                    
                    <div class="candle"></div>
                    <div class="flame"></div>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button class="blow-btn" id="blowBtn">吹蜡烛</button>
            <button class="cut-btn" id="cutBtn">切蛋糕</button>
            <button class="eat-btn" id="eatBtn">吃蛋糕</button>
        </div>
        
        <div class="status" id="status">蜡烛正在燃烧，快许个愿吧！</div>
        
        <div class="plate-container" id="plateContainer">
            <div class="plate-label">切好的蛋糕</div>
            <div class="plate">
                <div class="plate-rim"></div>
                <!-- 蛋糕切片区域 -->
                <div class="cake-slice" id="slice1">
                    <div class="cake-slice-frosting"></div>
                </div>
                <div class="cake-slice" id="slice2">
                    <div class="cake-slice-frosting"></div>
                </div>
                <div class="cake-slice" id="slice3">
                    <div class="cake-slice-frosting"></div>
                </div>
                <div class="cake-slice" id="slice4">
                    <div class="cake-slice-frosting"></div>
                </div>
                <div class="cake-slice" id="slice5">
                    <div class="cake-slice-frosting"></div>
                </div>
                <div class="cake-slice" id="slice6">
                    <div class="cake-slice-frosting"></div>
                </div>
                <div class="cake-slice" id="slice7">
                    <div class="cake-slice-frosting"></div>
                </div>
                <div class="cake-slice" id="slice8">
                    <div class="cake-slice-frosting"></div>
                </div>
            </div>
        </div>
        
        <button class="continue-btn" id="continueBtn">继续</button>
    </div>
    
    <!-- 生日祝福弹窗 -->
    <div class="birthday-message-popup" id="birthdayPopup">
        <div class="birthday-message-content">
            <h2>妈妈生日快乐🎉🎉</h2>
            <p>亲爱的妈妈，生日快乐<br>身体健康,天天开心!!</p>
            <button class="close-popup" id="closePopup">关闭</button>
        </div>
    </div>

    <script>
        // 获取DOM元素
        const blowBtn = document.getElementById('blowBtn');
        const cutBtn = document.getElementById('cutBtn');
        const eatBtn = document.getElementById('eatBtn');
        const continueBtn = document.getElementById('continueBtn');
        const flame = document.querySelector('.flame');
        const statusText = document.getElementById('status');
        const plateContainer = document.getElementById('plateContainer');
        const birthdayPopup = document.getElementById('birthdayPopup');
        const closePopup = document.getElementById('closePopup');
        
        // 蛋糕切片
        const slices = [
            document.getElementById('slice1'),
            document.getElementById('slice2'),
            document.getElementById('slice3'),
            document.getElementById('slice4'),
            document.getElementById('slice5'),
            document.getElementById('slice6'),
            document.getElementById('slice7'),
            document.getElementById('slice8')
        ];
        
        // 蜡烛状态
        let isCandleLit = true;
        // 蛋糕状态
        let cakePieces = 0;
        let cakeEaten = 0;
        
        // 吹蜡烛功能
        blowBtn.addEventListener('click', function() {
            if (isCandleLit) {
                flame.style.opacity = '0';
                statusText.textContent = '蜡烛吹灭了！愿望一定会实现的！';
                isCandleLit = false;
            } else {
                flame.style.opacity = '1';
                statusText.textContent = '蜡烛重新点燃了！再许个愿吧！';
                isCandleLit = true;
            }
        });
        
        // 切蛋糕功能
        cutBtn.addEventListener('click', function() {
            if (cakePieces < 8) {
                cakePieces += 2;
                updateCakeSlices();
                statusText.textContent = `蛋糕被切成了 ${cakePieces} 块！`;
                
                // 显示盘子
                if (cakePieces > 0 && !plateContainer.classList.contains('show')) {
                    plateContainer.classList.add('show');
                }
            } else {
                statusText.textContent = '蛋糕都切好了';
            }
        });
        
        // 吃蛋糕功能
        eatBtn.addEventListener('click', function() {
            if (cakeEaten < cakePieces) {
                cakeEaten++;
                updateCakeSlices();
                statusText.textContent = `已经吃了 ${cakeEaten} 块蛋糕，还剩 ${cakePieces - cakeEaten} 块！`;
                
                if (cakeEaten === cakePieces) {
                    statusText.textContent = '蛋糕全部吃完了！真美味！';
                    // 显示生日祝福弹窗
                    setTimeout(() => {
                        birthdayPopup.classList.add('show');
                    }, 1000);
                }
            } else {
                statusText.textContent = '没有蛋糕可吃了，先切蛋糕吧！';
            }
        });
        
        // 更新蛋糕切片显示
        function updateCakeSlices() {
            slices.forEach((slice, index) => {
                if (index < cakePieces) {
                    slice.classList.add('show');
                    
                    // 如果这块蛋糕已经被吃掉
                    if (index < cakeEaten) {
                        slice.classList.add('eaten');
                    } else {
                        slice.classList.remove('eaten');
                    }
                } else {
                    slice.classList.remove('show');
                }
            });
        }
        
        // 继续按钮功能
        continueBtn.addEventListener('click', function() {
            // 不再跳转到p8_Handwritten.html
            // 显示生日祝福弹窗
            birthdayPopup.classList.add('show');
        });
        
        // 关闭弹窗
        closePopup.addEventListener('click', function() {
            birthdayPopup.classList.remove('show');
        });
        
        // 点击弹窗背景关闭
        birthdayPopup.addEventListener('click', function(e) {
            if (e.target === birthdayPopup) {
                birthdayPopup.classList.remove('show');
            }
        });
    </script>
</body>
</html>
