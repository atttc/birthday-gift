<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日拼图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
        }
        
        body {
            background-color: #fdf5fc;
            color: #5a5a5a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        
        header {
            margin-bottom: 30px;
            padding: 20px;
            background-color: #e8f2b1;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            color: #8a6d3b;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        
        .subtitle {
            color: #a17e5f;
            font-size: 1.2rem;
        }
        
        .game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .puzzle-area {
            width: 450px;
            height: 450px;
            background-color: #e3e1f6;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .puzzle-piece {
            width: 150px;
            height: 150px;
            position: absolute;
            background-size: 450px 450px;
            border: 2px solid #fdf5fc;
            border-radius: 5px;
            cursor: move;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            touch-action: none; /* 防止触摸默认行为 */
        }
        
        .puzzle-piece:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            z-index: 10;
        }
        
        .puzzle-piece.correct {
            border-color: #bed7a1;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        #reset-btn {
            background-color: #bed7a1;
            color: #5a5a5a;
        }
        
        #continue-btn {
            background-color: #f4bfe3;
            color: #5a5a5a;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        .success-message {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .message-box {
            background: linear-gradient(135deg, #e8f2b1, #f4bfe3);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            animation: popIn 0.5s ease-out;
        }
        
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .message-box h2 {
            color: #8a6d3b;
            margin-bottom: 20px;
            font-size: 2.2rem;
        }
        
        .message-box p {
            color: #5a5a5a;
            margin-bottom: 25px;
            font-size: 1.2rem;
            line-height: 1.5;
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f4bfe3;
            opacity: 0.7;
            animation: fall linear forwards;
        }
        
        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        .loading {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            z-index: 50;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #f4bfe3;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .puzzle-area {
                width: 300px;
                height: 300px;
            }
            
            .puzzle-piece {
                width: 100px;
                height: 100px;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>生日拼图</h1>
            <p class="subtitle">将图片碎片拖放到正确位置完成拼图</p>
        </header>
        
        <div class="game-container">
            <div class="puzzle-area" id="puzzle-area">
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>加载拼图中...</p>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button id="reset-btn">重置拼图</button>
            <button id="continue-btn">继续</button>
        </div>
    </div>
    
    <div class="success-message" id="success-message">
        <div class="message-box">
            <h2>恭喜！</h2>
            <p>你成功完成了拼图！</p>
            <button id="close-message">关闭</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const puzzleArea = document.getElementById('puzzle-area');
            const resetBtn = document.getElementById('reset-btn');
            const continueBtn = document.getElementById('continue-btn');
            const successMessage = document.getElementById('success-message');
            const closeMessage = document.getElementById('close-message');
            const loading = document.getElementById('loading');
            
            const rows = 3;
            const cols = 3;
            const pieceSize = puzzleArea.offsetWidth / cols;
            let pieces = [];
            let isCompleted = false;
            let imageUrl = '111.png'; // 可以修改为其他图片路径
            
            // 初始化拼图
            function initPuzzle() {
                puzzleArea.innerHTML = '';
                loading.style.display = 'flex';
                pieces = [];
                isCompleted = false;
                
                // 预加载图片
                const img = new Image();
                img.onload = function() {
                    createPuzzlePieces();
                    loading.style.display = 'none';
                };
                img.onerror = function() {
                    loading.innerHTML = '<p>图片加载失败，请检查图片路径</p>';
                };
                img.src = imageUrl;
            }
            
            // 创建拼图块
            function createPuzzlePieces() {
                // 创建拼图块容器
                const piecesContainer = document.createElement('div');
                piecesContainer.style.width = '100%';
                piecesContainer.style.height = '100%';
                piecesContainer.style.position = 'relative';
                puzzleArea.appendChild(piecesContainer);
                
                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < cols; col++) {
                        const piece = document.createElement('div');
                        piece.className = 'puzzle-piece';
                        piece.dataset.row = row;
                        piece.dataset.col = col;
                        
                        // 设置背景图片和位置
                        piece.style.backgroundImage = `url('${imageUrl}')`;
                        piece.style.backgroundSize = `${puzzleArea.offsetWidth}px ${puzzleArea.offsetHeight}px`;
                        piece.style.backgroundPosition = `-${col * pieceSize}px -${row * pieceSize}px`;
                        
                        // 随机位置
                        const randomX = Math.random() * (puzzleArea.offsetWidth - pieceSize);
                        const randomY = Math.random() * (puzzleArea.offsetHeight - pieceSize);
                        
                        piece.style.left = `${randomX}px`;
                        piece.style.top = `${randomY}px`;
                        
                        // 添加拖拽功能
                        makeDraggable(piece);
                        
                        piecesContainer.appendChild(piece);
                        pieces.push(piece);
                    }
                }
            }
            
            // 使元素可拖拽
            function makeDraggable(element) {
                let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
                let isDragging = false;
                
                element.onmousedown = dragMouseDown;
                element.ontouchstart = dragTouchStart;
                
                function dragMouseDown(e) {
                    e.preventDefault();
                    // 获取鼠标初始位置
                    pos3 = e.clientX;
                    pos4 = e.clientY;
                    document.onmouseup = closeDragElement;
                    document.onmousemove = elementDrag;
                    element.style.zIndex = 100;
                    isDragging = true;
                }
                
                function dragTouchStart(e) {
                    e.preventDefault();
                    const touch = e.touches[0];
                    pos3 = touch.clientX;
                    pos4 = touch.clientY;
                    document.ontouchend = closeDragElement;
                    document.ontouchmove = elementTouchDrag;
                    element.style.zIndex = 100;
                    isDragging = true;
                }
                
                function elementDrag(e) {
                    if (!isDragging) return;
                    e.preventDefault();
                    // 计算新位置
                    pos1 = pos3 - e.clientX;
                    pos2 = pos4 - e.clientY;
                    pos3 = e.clientX;
                    pos4 = e.clientY;
                    
                    // 设置元素新位置
                    updateElementPosition(element, pos1, pos2);
                }
                
                function elementTouchDrag(e) {
                    if (!isDragging) return;
                    e.preventDefault();
                    const touch = e.touches[0];
                    pos1 = pos3 - touch.clientX;
                    pos2 = pos4 - touch.clientY;
                    pos3 = touch.clientX;
                    pos4 = touch.clientY;
                    
                    // 设置元素新位置
                    updateElementPosition(element, pos1, pos2);
                }
                
                function updateElementPosition(element, deltaX, deltaY) {
                    let newTop = element.offsetTop - deltaY;
                    let newLeft = element.offsetLeft - deltaX;
                    
                    // 限制在拼图区域内
                    newTop = Math.max(0, Math.min(puzzleArea.offsetHeight - pieceSize, newTop));
                    newLeft = Math.max(0, Math.min(puzzleArea.offsetWidth - pieceSize, newLeft));
                    
                    element.style.top = newTop + "px";
                    element.style.left = newLeft + "px";
                }
                
                function closeDragElement() {
                    document.onmouseup = null;
                    document.onmousemove = null;
                    document.ontouchend = null;
                    document.ontouchmove = null;
                    element.style.zIndex = 1;
                    isDragging = false;
                    
                    // 检查是否在正确位置
                    checkPosition(element);
                    
                    // 检查拼图是否完成
                    if (!isCompleted) {
                        checkCompletion();
                    }
                }
            }
            
            // 检查拼图块是否在正确位置
            function checkPosition(piece) {
                const row = parseInt(piece.dataset.row);
                const col = parseInt(piece.dataset.col);
                
                const correctTop = row * pieceSize;
                const correctLeft = col * pieceSize;
                
                const currentTop = parseInt(piece.style.top);
                const currentLeft = parseInt(piece.style.left);
                
                // 如果位置接近正确位置，则吸附到正确位置
                const threshold = 20; // 容错范围
                if (Math.abs(currentTop - correctTop) < threshold && 
                    Math.abs(currentLeft - correctLeft) < threshold) {
                    piece.style.top = correctTop + "px";
                    piece.style.left = correctLeft + "px";
                    piece.classList.add('correct');
                } else {
                    piece.classList.remove('correct');
                }
            }
            
            // 检查拼图是否完成
            function checkCompletion() {
                let allCorrect = true;
                
                for (const piece of pieces) {
                    const row = parseInt(piece.dataset.row);
                    const col = parseInt(piece.dataset.col);
                    
                    const correctTop = row * pieceSize;
                    const correctLeft = col * pieceSize;
                    
                    const currentTop = parseInt(piece.style.top);
                    const currentLeft = parseInt(piece.style.left);
                    
                    if (currentTop !== correctTop || currentLeft !== correctLeft) {
                        allCorrect = false;
                        break;
                    }
                }
                
                if (allCorrect) {
                    isCompleted = true;
                    showSuccessMessage();
                }
            }
            
            // 显示成功消息
            function showSuccessMessage() {
                successMessage.style.display = 'flex';
                createConfetti();
            }
            
            // 创建五彩纸屑效果
            function createConfetti() {
                const colors = ['#bed7a1', '#e3e1f6', '#e8f2b1', '#fdf5fc', '#f4bfe3'];
                
                for (let i = 0; i < 100; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = Math.random() * 10 + 5 + 'px';
                    confetti.style.height = Math.random() * 10 + 5 + 'px';
                    confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
                    document.body.appendChild(confetti);
                    
                    // 动画结束后移除元素
                    setTimeout(() => {
                        confetti.remove();
                    }, 5000);
                }
            }
            
            // 事件监听
            resetBtn.addEventListener('click', initPuzzle);
            
            closeMessage.addEventListener('click', function() {
                successMessage.style.display = 'none';
            });
            
            continueBtn.addEventListener('click', function() {
                // 在实际应用中，这里应该跳转到指定页面
                window.location.href = 'p2_GiftBox.html';
            });
            
            // 初始化游戏
            initPuzzle();
        });
    </script>
</body>
</html>
