<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日祝福留言</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
        }
        
        body {
            background-color: #fdf5fc; /* 淡粉色背景 */
            background-image: url('balloon.png'); /* 添加气球背景图片 */
            background-size: cover; /* 覆盖整个页面 */
            background-position: center; /* 居中显示 */
            background-attachment: fixed; /* 固定背景 */
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
        }
        
        /* 添加半透明遮罩层，确保内容可读性 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(253, 245, 252, 0.85); /* 半透明遮罩 */
            z-index: -1;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-top: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            color: #f4bfe3; /* 粉色标题 */
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .subtitle {
            color: #bed7a1; /* 绿色副标题 */
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        
        .message-area {
            background-color: #e8f2b1; /* 淡绿色背景 */
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.05);
        }
        
        textarea {
            width: 100%;
            height: 200px;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 1rem;
            background-color: white;
            resize: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        
        textarea:focus {
            outline: none;
            box-shadow: 0 5px 15px rgba(244, 191, 227, 0.3);
        }
        
        .character-count {
            text-align: right;
            margin-top: 10px;
            color: #888;
            font-size: 0.9rem;
        }
        
        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        #submit-btn {
            background-color: #bed7a1; /* 绿色按钮 */
            color: white;
        }
        
        #submit-btn:hover {
            background-color: #a8c285;
            transform: translateY(-3px);
        }
        
        #continue-btn {
            background-color: #e3e1f6; /* 浅紫色按钮 */
            color: #555;
        }
        
        #continue-btn:hover {
            background-color: #d1cef0;
            transform: translateY(-3px);
        }
        
        .message-list {
            margin-top: 30px;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
        }
        
        .message-item {
            background-color: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            border-left: 5px solid #f4bfe3; /* 粉色边框 */
        }
        
        .message-item p {
            margin-bottom: 10px;
            line-height: 1.5;
        }
        
        .message-meta {
            display: flex;
            justify-content: space-between;
            color: #888;
            font-size: 0.8rem;
        }
        
        .empty-message {
            text-align: center;
            color: #aaa;
            padding: 20px;
            font-style: italic;
        }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #f4bfe3;
            opacity: 0;
            z-index: 1000;
            pointer-events: none;
        }
        
        @keyframes confetti-fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        footer {
            margin-top: 30px;
            text-align: center;
            color: #aaa;
            font-size: 0.9rem;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .buttons {
                flex-direction: column;
                gap: 15px;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>留言板</h1>
            <!-- <p class="subtitle">写下您对寿星最真挚的祝福吧！</p> -->
        </header>
        
        <div class="message-area">
            <textarea id="message-input" placeholder="在这里写下您的留言..."></textarea>
            <div class="character-count">
                <span id="char-count">0</span>/500
            </div>
        </div>
        
        <div class="buttons">
            <button id="submit-btn">提交</button>
            <button id="continue-btn">继续</button>
        </div>
        
        <div class="message-list" id="message-list">
            <!-- <div class="empty-message">还没有祝福，快写下第一条祝福吧！</div> -->
        </div>
    </div>
    
    <footer>
        <!-- <p>© 2023 生日祝福留言板 | 所有祝福都将被珍藏</p> -->
    </footer>

    <script>
        // 获取DOM元素
        const messageInput = document.getElementById('message-input');
        const charCount = document.getElementById('char-count');
        const submitBtn = document.getElementById('submit-btn');
        const continueBtn = document.getElementById('continue-btn');
        const messageList = document.getElementById('message-list');
        
        // 字符计数
        messageInput.addEventListener('input', function() {
            const count = this.value.length;
            charCount.textContent = count;
            
            if (count > 500) {
                charCount.style.color = 'red';
            } else {
                charCount.style.color = '#888';
            }
        });
        
        // 提交祝福
        submitBtn.addEventListener('click', function() {
            const message = messageInput.value.trim();
            
            if (message === '') {
                alert('请输入祝福语！');
                return;
            }
            
            if (message.length > 500) {
                alert('祝福语不能超过500个字符！');
                return;
            }
            
            // 创建新的祝福项
            const messageItem = document.createElement('div');
            messageItem.className = 'message-item';
            
            const now = new Date();
            const timeString = `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2, '0')}-${now.getDate().toString().padStart(2, '0')} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            
            messageItem.innerHTML = `
                <p>${message}</p>
                <div class="message-meta">
                    <span>匿名祝福</span>
                    <span>${timeString}</span>
                </div>
            `;
            
            // 移除空消息提示
            const emptyMessage = messageList.querySelector('.empty-message');
            if (emptyMessage) {
                emptyMessage.remove();
            }
            
            // 添加新消息到顶部
            messageList.insertBefore(messageItem, messageList.firstChild);
            
            // 清空输入框
            messageInput.value = '';
            charCount.textContent = '0';
            
            // 创建五彩纸屑效果
            createConfetti();
            
            // 显示成功消息
            alert('祝福提交成功！');
        });
        
        // 继续按钮 - 返回p2_GiftBox.html
        continueBtn.addEventListener('click', function() {
            window.location.href = 'p2_GiftBox.html';
        });
        
        // 创建五彩纸屑效果
        function createConfetti() {
            const colors = ['#bed7a1', '#e3e1f6', '#e8f2b1', '#fdf5fc', '#f4bfe3'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.width = Math.random() * 10 + 5 + 'px';
                confetti.style.height = Math.random() * 10 + 5 + 'px';
                confetti.style.animation = `confetti-fall ${Math.random() * 3 + 2}s linear forwards`;
                
                document.body.appendChild(confetti);
                
                // 动画结束后移除元素
                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }
    </script>
</body>
</html>
