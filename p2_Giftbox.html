<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日惊喜礼盒</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
            background: url('balloon.png') center/cover no-repeat, 
                        linear-gradient(135deg, #fdf5fc 0%, #e8f2b1 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            color: #f4bfe3;
            font-size: 3rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.7);
            padding: 15px 30px;
            border-radius: 50px;
            display: inline-block;
        }
        
        .instructions {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            max-width: 800px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.058)
        }
        
        .instructions h2 {
            color: #f4bfe3;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }
        
        .instructions p {
            color: #666;
            line-height: 1.6;
            font-size: 1.2rem;
        }
        
        .gift-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 40px;
            margin: 40px 0;
            width: 100%;
            max-width: 900px;
            justify-items: center;
        }
        
        .gift-box {
            width: 200px;
            height: 200px;
            perspective: 1000px;
            cursor: pointer;
            transition: transform 0.3s ease;
            position: relative;
        }
        
        .gift-box:hover {
            transform: scale(1.05);
        }
        
        .gift-box.opened {
            opacity: 0.7;
            pointer-events: none;
            transform: scale(0.95);
        }
        
        .gift-box.opened .gift-inner {
            transform: rotateY(180deg);
        }
        
        .gift-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.8s;
        }
        
        .gift-box:hover .gift-inner {
            transform: rotateY(10deg) rotateX(5deg);
        }
        
        .gift-front, .gift-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }
        
        .gift-front {
            background-color: #bed7a1;
        }
        
        .gift-back {
            background-color: #e3e1f6;
            transform: rotateY(180deg);
            color: #333;
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .ribbon {
            position: absolute;
            background-color: #f4bfe3;
            border-radius: 5px;
        }
        
        .ribbon-horizontal {
            width: 100%;
            height: 20px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .ribbon-vertical {
            width: 20px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .bow {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #f4bfe3;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }
        
        .bow::before, .bow::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #f4bfe3;
            border-radius: 50%;
        }
        
        .bow::before {
            top: -15px;
            left: -15px;
        }
        
        .bow::after {
            bottom: -15px;
            right: -15px;
        }
        
        .gift-label {
            color: #fff;
            font-size: 1.5rem;
            margin-top: 10px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            font-weight: bold;
        }
        
        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            width: 100%;
        }
        
        .next-button, .reset-button {
            background-color: #e8f2b1;
            color: #333;
            border: none;
            padding: 15px 40px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            display: none;
        }
        
        .next-button:hover, .reset-button:hover {
            background-color: #bed7a1;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        /* 气球动画 */
        .balloon {
            position: absolute;
            bottom: -100px;
            width: 40px;
            height: 50px;
            border-radius: 50%;
            animation: float 15s ease-in infinite;
            z-index: 1;
            opacity: 0.7;
        }
        
        .balloon::before {
            content: '';
            position: absolute;
            width: 2px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.7);
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100vh) rotate(20deg);
                opacity: 0;
            }
        }
        
        /* 烟花特效 */
        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            pointer-events: none;
            animation: explode 1s ease-out forwards;
        }
        
        @keyframes explode {
            0% {
                transform: translate(0, 0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty));
                opacity: 0;
            }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .gift-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
            
            .gift-box {
                width: 150px;
                height: 150px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .button-container {
                flex-direction: column;
                align-items: center;
            }
        }
        
        @media (max-width: 480px) {
            .gift-container {
                grid-template-columns: 1fr;
            }
            
            .gift-box {
                width: 180px;
                height: 180px;
            }
        }
        
        .message {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            max-width: 800px;
            width: 100%;
            display: none;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .message h2 {
            color: #f4bfe3;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }
        
        .message p {
            color: #666;
            line-height: 1.6;
            font-size: 1.2rem;
        }
        
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            display: none;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f4bfe3;
            border-top: 5px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>生日惊喜礼盒</h1>
        
        <div class="instructions">
            <h2>点击每个礼盒，体验不同的生日惊喜！</h2>
            <p>所有礼盒都打开后，可以前往生日蛋糕页面</p>
        </div>
        
        <div class="gift-container">
            <div class="gift-box" data-link="p3_Blessing.html">
                <div class="gift-inner">
                    <div class="gift-front">
                        <div class="ribbon ribbon-horizontal"></div>
                        <div class="ribbon ribbon-vertical"></div>
                        <div class="bow"></div>
                        <div class="gift-label">留言</div>
                    </div>
                    <div class="gift-back">留言</div>
                </div>
            </div>
            
            <div class="gift-box" data-link="p4_JigsawPuzzle.html">
                <div class="gift-inner">
                    <div class="gift-front">
                        <div class="ribbon ribbon-horizontal"></div>
                        <div class="ribbon ribbon-vertical"></div>
                        <div class="bow"></div>
                        <div class="gift-label">拼图</div>
                    </div>
                    <div class="gift-back">拼图</div>
                </div>
            </div>
            
            <div class="gift-box" data-link="p5_MazeGame.html">
                <div class="gift-inner">
                    <div class="gift-front">
                        <div class="ribbon ribbon-horizontal"></div>
                        <div class="ribbon ribbon-vertical"></div>
                        <div class="bow"></div>
                        <div class="gift-label">迷宫</div>
                    </div>
                    <div class="gift-back">迷宫</div>
                </div>
            </div>
            
            <div class="gift-box" data-link="p6_WishingWell.html">
                <div class="gift-inner">
                    <div class="gift-front">
                        <div class="ribbon ribbon-horizontal"></div>
                        <div class="ribbon ribbon-vertical"></div>
                        <div class="bow"></div>
                        <div class="gift-label">许愿</div>
                    </div>
                    <div class="gift-back">许愿</div>
                </div>
            </div>
        </div>
        
        <div class="message" id="completionMessage">
            <h2>恭喜！</h2>
            <p>你已经打开了所有的生日礼盒！现在可以前往生日蛋糕</p>
        </div>
        
        <div class="button-container">
            <button class="next-button" id="nextButton">前往生日蛋糕</button>
            <button class="reset-button" id="resetButton">重新开始</button>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
    </div>

    <script>
        // 创建气球
        function createBalloons() {
            const colors = ['#bed7a1', '#e3e1f6', '#e8f2b1', '#f4bfe3'];
            const balloonCount = 15;
            
            for (let i = 0; i < balloonCount; i++) {
                const balloon = document.createElement('div');
                balloon.className = 'balloon';
                
                // 随机颜色和位置
                const color = colors[Math.floor(Math.random() * colors.length)];
                balloon.style.backgroundColor = color;
                balloon.style.left = `${Math.random() * 100}vw`;
                balloon.style.animationDelay = `${Math.random() * 10}s`;
                
                document.body.appendChild(balloon);
            }
        }
        
        // 烟花特效
        function createFirework(x, y) {
            const colors = ['#bed7a1', '#e3e1f6', '#e8f2b1', '#f4bfe3'];
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'firework';
                
                // 随机颜色
                const color = colors[Math.floor(Math.random() * colors.length)];
                particle.style.backgroundColor = color;
                
                // 随机位置
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 100 + 50;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                particle.style.setProperty('--tx', `${tx}px`);
                particle.style.setProperty('--ty', `${ty}px`);
                
                // 设置初始位置
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;
                
                document.body.appendChild(particle);
                
                // 移除粒子
                setTimeout(() => {
                    particle.remove();
                }, 1000);
            }
        }
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            // 创建气球
            createBalloons();
            
            // 检查已打开的礼盒
            checkOpenedGifts();
            
            // 点击礼盒事件
            const giftBoxes = document.querySelectorAll('.gift-box');
            giftBoxes.forEach(box => {
                box.addEventListener('click', function() {
                    const link = this.getAttribute('data-link');
                    
                    // 标记为已打开
                    markGiftAsOpened(link);
                    
                    // 显示加载动画
                    document.getElementById('loading').style.display = 'flex';
                    
                    // 跳转到对应页面
                    setTimeout(() => {
                        window.location.href = link;
                    }, 1500);
                });
            });
            
            // 点击页面产生烟花
            document.addEventListener('click', function(e) {
                createFirework(e.clientX, e.clientY);
            });
            
            // 下一步按钮事件
            document.getElementById('nextButton').addEventListener('click', function() {
                document.getElementById('loading').style.display = 'flex';
                setTimeout(() => {
                    window.location.href = 'p7_Cake.html';
                }, 1500);
            });
            
            // 重置按钮事件
            document.getElementById('resetButton').addEventListener('click', function() {
                resetAllGifts();
            });
        });
        
        // 检查已打开的礼盒
        function checkOpenedGifts() {
            const giftBoxes = document.querySelectorAll('.gift-box');
            let allOpened = true;
            
            giftBoxes.forEach(box => {
                const link = box.getAttribute('data-link');
                if (localStorage.getItem(`gift_${link}`) === 'opened') {
                    box.classList.add('opened');
                } else {
                    allOpened = false;
                }
            });
            
            // 如果所有礼盒都已打开，显示下一步按钮和完成消息
            if (allOpened) {
                document.getElementById('nextButton').style.display = 'block';
                document.getElementById('resetButton').style.display = 'block';
                document.getElementById('completionMessage').style.display = 'block';
            } else {
                document.getElementById('resetButton').style.display = 'block';
            }
        }
        
        // 标记礼盒为已打开
        function markGiftAsOpened(link) {
            localStorage.setItem(`gift_${link}`, 'opened');
            checkOpenedGifts();
        }
        
        // 重置所有礼盒
        function resetAllGifts() {
            const giftBoxes = document.querySelectorAll('.gift-box');
            giftBoxes.forEach(box => {
                const link = box.getAttribute('data-link');
                localStorage.removeItem(`gift_${link}`);
                box.classList.remove('opened');
            });
            
            document.getElementById('nextButton').style.display = 'none';
            document.getElementById('resetButton').style.display = 'none';
            document.getElementById('completionMessage').style.display = 'none';
            
            // 创建庆祝烟花
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    createFirework(
                        Math.random() * window.innerWidth,
                        Math.random() * window.innerHeight
                    );
                }, i * 200);
            }
        }
    </script>
</body>
</html>
